[package]
name = "nsm-attest"
version = "0.1.0"
edition = "2021"
description = "Request a Nitro Security Module attestation document with report_data as user_data"

[[bin]]
name = "nsm-attest"
path = "src/main.rs"

[dependencies]
aws-nitro-enclaves-nsm-api = "0.4"
serde_bytes = "0.11"

[profile.release]
opt-level = "z"
lto = true
strip = true
